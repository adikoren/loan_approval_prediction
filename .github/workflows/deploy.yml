name: Build and deploy to DigitalOcean Kubernetes

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "rag/**"
      - "frontend/**"
      - "docs/**"
      - "k8s/**"
      - "config.py"
      - "requirements-docker.txt"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "experiments/model.joblib"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

env:
  # One-time infra names/settings. Change these via repo Settings > Variables
  # (Settings > Secrets and variables > Actions > Variables) if you want
  # different values without editing this file.
  REGISTRY_NAME: ${{ vars.DO_REGISTRY_NAME || 'loansight' }}
  CLUSTER_NAME: ${{ vars.DO_CLUSTER_NAME || 'loansight' }}
  DO_REGION: ${{ vars.DO_REGION || 'nyc1' }}
  NODE_SIZE: ${{ vars.DO_NODE_SIZE || 's-2vcpu-4gb' }}
  NODE_COUNT: ${{ vars.DO_NODE_COUNT || '1' }}
  IMAGE_NAME: loansight

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # --- One-time infra bootstrap (idempotent: safe to run every time) ---

      - name: Ensure container registry exists
        run: |
          if ! doctl registry get "$REGISTRY_NAME" >/dev/null 2>&1; then
            echo "Creating container registry '$REGISTRY_NAME'..."
            doctl registry create "$REGISTRY_NAME" --subscription-tier basic --region "$DO_REGION"
          else
            echo "Registry '$REGISTRY_NAME' already exists."
          fi

      - name: Ensure DOKS cluster exists
        run: |
          if ! doctl kubernetes cluster get "$CLUSTER_NAME" >/dev/null 2>&1; then
            echo "Creating DOKS cluster '$CLUSTER_NAME' (this takes several minutes)..."
            doctl kubernetes cluster create "$CLUSTER_NAME" \
              --region "$DO_REGION" \
              --size "$NODE_SIZE" \
              --count "$NODE_COUNT" \
              --wait
          else
            echo "Cluster '$CLUSTER_NAME' already exists."
          fi

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"

      - name: Link registry to cluster (so nodes can pull private images)
        run: doctl kubernetes cluster registry add "$CLUSTER_NAME"

      # --- Build and push the image ---

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build image
        run: |
          IMAGE="registry.digitalocean.com/$REGISTRY_NAME/$IMAGE_NAME"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          echo "IMAGE_REF=$IMAGE:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Push image
        run: |
          IMAGE="registry.digitalocean.com/$REGISTRY_NAME/$IMAGE_NAME"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # --- Deploy ---

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Sync Anthropic API key secret
        run: |
          kubectl create secret generic loansight-secrets \
            --namespace loansight \
            --from-literal=anthropic-api-key="${{ secrets.ANTHROPIC_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render and apply deployment
        run: |
          sed "s|__IMAGE__|${IMAGE_REF}|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/loansight -n loansight --timeout=300s

      - name: Get live URL
        run: |
          echo "Waiting for the DigitalOcean Load Balancer to get a public IP..."
          for i in $(seq 1 30); do
            IP=$(kubectl get svc loansight -n loansight -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$IP" ]; then
              echo "### LoanSight is live at: http://$IP" >> "$GITHUB_STEP_SUMMARY"
              echo "Live URL: http://$IP"
              break
            fi
            sleep 10
          done
