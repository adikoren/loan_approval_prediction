apiVersion: v1
kind: Service
metadata:
  name: loansight
  namespace: loansight
  annotations:
    # Cheapest DO Load Balancer size available; bump if you outgrow it.
    service.beta.kubernetes.io/do-loadbalancer-size-slug: "lb-small"
spec:
  type: LoadBalancer
  selector:
    app: loansight
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
