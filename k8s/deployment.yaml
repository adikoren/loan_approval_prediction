apiVersion: apps/v1
kind: Deployment
metadata:
  name: loansight
  namespace: loansight
  labels:
    app: loansight
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: loansight
  template:
    metadata:
      labels:
        app: loansight
    spec:
      containers:
        - name: loansight
          # Replaced at deploy time by CI with the freshly pushed image
          # reference (registry.digitalocean.com/<registry>/loansight:<sha>).
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loansight-secrets
                  key: anthropic-api-key
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          # rag_db/ is built once at container startup (docker-entrypoint.sh)
          # and the model-load + train.csv read also happen at startup, so
          # give the pod real time before probes start marking it unready.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
